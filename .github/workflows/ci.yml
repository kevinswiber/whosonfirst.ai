# Runs what CONTRIBUTING.md asks a contributor to run, on every pull request
# and on every change to main. Two jobs, side by side:
#
#   checks    formatting and lint (Biome), types, and the tests in test/unit/:
#             the rating rule, the contrast audit and the list of sources
#   rendered  the build, which refuses a broken cross-reference, and then the
#             tests in test/build/, which read the built site as files, and in
#             test/browser/, which open it in a browser
#
# The tests are run by Node's own test runner, a file in a process of its own
# and several files at once. Every check runs on every change: a change to any
# file under src/ can move what some page draws.
#
# Nothing here deploys the site or needs a secret, so it runs the same on a
# pull request from a fork.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces the run before it. Every other run
# is in a group of its own, by commit, so each change to main is checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, types and rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # `biome ci` checks what `npm run check` checks, and marks what it finds
      # on the lines of the pull request.
      - name: Format, lint and import order
        run: npx biome ci
      - name: Types, rating rule, contrast audit and sources
        run: npm test

  rendered:
    name: Build and rendered checks
    runs-on: ubuntu-latest
    # The build and the checks take about two minutes between them.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      # The checks run headless, so the headless shell is all they need, and the
      # runner's image already has the libraries it links against. With
      # `--with-deps` the step also asked apt for nine font packages: fonts for
      # scripts the site does not use, and for a display the headless shell
      # never opens. The job then failed whenever the runner could not reach
      # the Ubuntu mirror, before any check had run.
      - name: Install Chromium
        run: npx playwright install --only-shell chromium
      - name: Rendered checks
        run: npm run check:rendered
